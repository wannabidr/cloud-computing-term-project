# Minimal OpenClaw config for the AaaS demo.
# Just enough to enable the OpenAI-compatible /v1/chat/completions endpoint.

gateway:
  mode: local
  http:
    enabled: true
    bind: lan
  openaiCompat:
    enabled: true
  auth:
    bearer:
      tokens:
        - "internal-aaas-to-openclaw-token-change-me"

agents:
  defaults:
    sandbox:
      docker:
        user: "1000:1000"        # 호스트의 일반 uid
        readOnly: false
        cap_drop: ["ALL"]
        security_opt:
          - "no-new-privileges:true"
        network: "none"            # 외부 네트워크 차단 (필요 시)

models:
  providers:
    openai:
      baseUrl: "http://mock-llm:9001/v1"
      apiKey: "mock-key-not-used"